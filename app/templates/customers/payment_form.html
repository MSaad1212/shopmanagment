{% extends "dashboard.html" %}
{% block title %}Customer Payment{% endblock %}
{% block page_title %}Payment from Customer{% endblock %}
{% block content %}
<div class="glass-panel" style="padding:24px;max-width:520px;">
<form method="POST" action="/customers/payments/new">
    <div class="form-group">
        <label>Customer *</label>
        <select name="customer_id" class="form-control" required>
            <option value="">Select…</option>
            {% for c in customers %}
            <option value="{{ c.id }}">{{ c.name }} (due Rs. {{ '%.2f'|format(c.current_balance|float) }})</option>
            {% endfor %}
        </select>
    </div>
    <div class="form-group"><label>Date *</label><input type="date" name="date" class="form-control" value="{{ today }}" required></div>
    <div class="form-group"><label>Amount *</label><input type="number" step="0.01" name="amount" class="form-control" required></div>
    <div class="form-group">
        <label>Method *</label>
        <select name="payment_method" class="form-control">
            {% for m in payment_methods %}<option value="{{ m }}">{{ m }}</option>{% endfor %}
        </select>
    </div>
    <div class="form-group"><label>Note</label><input name="note" class="form-control"></div>
    <div style="display:flex;gap:10px;">
        <button type="submit" class="btn btn-primary" style="width:auto;">Save Payment</button>
        <a href="/customers" class="btn btn-secondary" style="width:auto;">Cancel</a>
    </div>
</form>
</div>
{% endblock %}
