{% extends "dashboard.html" %}
{% block title %}New Sale{% endblock %}
{% block page_title %}New Sale Entry{% endblock %}
{% block content %}
<div class="glass-panel" style="padding:24px;">
<form method="POST" action="/customers/sales/new">
    <div class="form-grid">
        <div class="form-group">
            <label>Customer *</label>
            <select name="customer_id" id="customer-select" class="form-control" required>
                <option value="">Select a customer...</option>
                {% for c in customers %}
                <option value="{{ c.id }}" data-balance="{{ c.current_balance }}">{{ c.customer_code }} — {{ c.name }}</option>
                {% endfor %}
            </select>
            <div id="customer-balance-info" style="margin-top: 6px; font-size: 0.85rem; font-weight: 500;"></div>
        </div>
        <div class="form-group"><label>Date *</label><input type="date" name="date" class="form-control" value="{{ today }}" required></div>
        <div class="form-group"><label>Amount Received Now</label><input type="number" step="0.01" name="amount_received" class="form-control" value="0"></div>
        <div class="form-group">
            <label>Payment Method</label>
            <select name="payment_method" class="form-control">
                {% for m in payment_methods %}<option value="{{ m }}">{{ m }}</option>{% endfor %}
            </select>
        </div>
        <div class="form-group" style="grid-column:1/-1;"><label>Note</label><input name="note" class="form-control"></div>
    </div>
    <div style="display:flex; justify-content:space-between; align-items:flex-end; margin:20px 0 12px;">
        <h4 style="margin:0;">Items</h4>
        <div style="text-align:right;">
            <strong>Total Amount: </strong><span id="display-total" style="font-size:1.1rem; color:var(--accent-color);">0.00</span><br>
            <strong>Balance (Credit): </strong><span id="display-balance" style="font-size:1.1rem; color:var(--error);">0.00</span>
        </div>
    </div>
    <div class="table-container" style="margin-top:0;">
        <table class="data-table">
            <thead><tr><th>Item</th><th>Qty</th><th>Unit Price</th><th></th></tr></thead>
            <tbody id="lines-body">
                <tr class="line-row">
                    <td>
                        <select name="item_id" class="form-control item-select" required>
                            <option value="">Select item…</option>
                            {% for i in items %}
                            <option value="{{ i.id }}" data-price="{{ i.sale_price }}" data-stock="{{ i.current_stock }}">{{ i.brand }}{% if i.pattern %} {{ i.pattern }}{% endif %}{% if i.size %} {{ i.size }}{% endif %} (stock {{ i.current_stock }})</option>
                            {% endfor %}
                        </select>
                    </td>
                    <td><input type="number" name="quantity" class="form-control qty-input" min="1" value="1" required></td>
                    <td><input type="number" step="0.01" name="unit_price" class="form-control price-input" value="0" required></td>
                    <td><button type="button" class="btn btn-secondary remove-line" style="width:auto;padding:8px;">×</button></td>
                </tr>
            </tbody>
        </table>
    </div>
    <button type="button" id="add-line" class="btn btn-secondary" style="width:auto;margin-top:12px;">Add Line</button>
    <div style="display:flex;gap:10px;margin-top:20px;">
        <button type="submit" class="btn btn-primary" style="width:auto;">Save Sale</button>
        <a href="/customers/sales" class="btn btn-secondary" style="width:auto;">Cancel</a>
    </div>
</form>
</div>
<script>
function calculateTotals() {
    let total = 0;
    document.querySelectorAll('.line-row').forEach(row => {
        const qty = parseFloat(row.querySelector('.qty-input').value) || 0;
        const price = parseFloat(row.querySelector('.price-input').value) || 0;
        total += (qty * price);
    });
    const received = parseFloat(document.querySelector('input[name="amount_received"]').value) || 0;
    const balance = total - received;
    
    document.getElementById('display-total').textContent = total.toFixed(2);
    const balEl = document.getElementById('display-balance');
    balEl.textContent = balance.toFixed(2);
    balEl.style.color = balance > 0 ? 'var(--error)' : 'var(--success)';
}

document.querySelector('input[name="amount_received"]').addEventListener('input', calculateTotals);

document.getElementById('customer-select').addEventListener('change', function(e) {
    const opt = e.target.selectedOptions[0];
    const info = document.getElementById('customer-balance-info');
    if (!opt || !opt.value) {
        info.textContent = '';
        return;
    }
    const bal = parseFloat(opt.getAttribute('data-balance')) || 0;
    if (bal < 0) {
        info.textContent = `★ Customer has an Account Credit of Rs. ${Math.abs(bal).toFixed(2)} available.`;
        info.style.color = 'var(--success)';
    } else if (bal > 0) {
        info.textContent = `Customer currently owes: Rs. ${bal.toFixed(2)}`;
        info.style.color = 'var(--error)';
    } else {
        info.textContent = 'Customer account is settled.';
        info.style.color = 'var(--text-muted)';
    }
});

document.getElementById('add-line').addEventListener('click', function() {
    const body = document.getElementById('lines-body');
    const row = body.querySelector('.line-row').cloneNode(true);
    row.querySelectorAll('input').forEach(i => { if (i.name==='quantity') i.value=1; else if (i.name==='unit_price') i.value=0; });
    row.querySelector('select').selectedIndex = 0;
    body.appendChild(row);
    calculateTotals();
});
document.getElementById('lines-body').addEventListener('click', function(e) {
    if (e.target.classList.contains('remove-line') && document.querySelectorAll('.line-row').length > 1) e.target.closest('tr').remove();
});
document.getElementById('lines-body').addEventListener('input', function(e) {
    if (e.target.classList.contains('qty-input') || e.target.classList.contains('price-input')) {
        calculateTotals();
    }
});

document.getElementById('lines-body').addEventListener('change', function(e) {
    if (e.target.name === 'item_id') {
        const opt = e.target.selectedOptions[0];
        e.target.closest('tr').querySelector('.price-input').value = opt.getAttribute('data-price') || 0;
        calculateTotals();
    }
});
</script>
{% endblock %}
