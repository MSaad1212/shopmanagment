<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Business Management System{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/style.css">
    <script src="https://unpkg.com/htmx.org@1.9.12"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body>
    {% block body %}
    {% endblock %}
    
    <script>
        lucide.createIcons();
        
        // Ensure Lucide icons are re-rendered on HTMX requests
        document.body.addEventListener('htmx:afterOnLoad', function() {
            lucide.createIcons();
        });

        function confirmDelete(event, itemName = 'item') {
            event.preventDefault();
            const form = event.currentTarget;
            Swal.fire({
                title: 'Are you sure?',
                text: `You want to delete this ${itemName}? This action cannot be undone.`,
                icon: 'warning',
                showCancelButton: true,
                confirmButtonColor: '#ef4444',
                cancelButtonColor: '#475569',
                confirmButtonText: 'Yes, delete it!',
                cancelButtonText: 'Cancel',
                background: '#ffffff',
                color: '#0f172a',
                iconColor: '#f59e0b',
                customClass: {
                    popup: 'swal-premium-popup'
                }
            }).then((result) => {
                if (result.isConfirmed) {
                    form.submit();
                }
            });
            return false;
        }
    </script>
</body>
</html>
