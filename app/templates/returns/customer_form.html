{% extends "dashboard.html" %}
{% block title %}Customer Return{% endblock %}
{% block page_title %}Customer Return{% endblock %}
{% block content %}
<div class="glass-panel" style="padding:24px;">
<form method="POST" action="/returns/customer/new">
    <div class="form-grid">
        <div class="form-group">
            <label>Customer *</label>
            <select name="customer_id" class="form-control" required>
                <option value="">Select…</option>
                {% for c in customers %}<option value="{{ c.id }}">{{ c.name }}</option>{% endfor %}
            </select>
        </div>
        <div class="form-group"><label>Date *</label><input type="date" name="date" class="form-control" value="{{ today }}" required></div>
        <div class="form-group">
            <label>Original Sale (optional)</label>
            <select name="sale_id" class="form-control">
                <option value="">—</option>
                {% for s in sales %}<option value="{{ s.id }}">{{ s.invoice_no }} — {{ s.date }}</option>{% endfor %}
            </select>
        </div>
        <div class="form-group">
            <label>Refund Method</label>
            <select name="refund_method" class="form-control">
                {% for m in refund_methods %}<option value="{{ m }}">{{ m }}</option>{% endfor %}
            </select>
        </div>
        <div class="form-group" style="grid-column:1/-1;"><label>Note</label><input name="note" class="form-control"></div>
    </div>
    <h4 style="margin:20px 0 12px;">Items Returned</h4>
    <div class="table-container" style="margin-top:0;">
        <table class="data-table">
            <thead><tr><th>Item</th><th>Qty</th><th>Rate</th><th>Reason</th><th></th></tr></thead>
            <tbody id="lines-body">
                <tr class="line-row">
                    <td>
                        <select name="item_id" class="form-control item-select" required>
                            <option value="">Select…</option>
                            {% for i in items %}
                            <option value="{{ i.id }}" data-price="{{ i.sale_price }}">{{ i.brand }}{% if i.pattern %} {{ i.pattern }}{% endif %}{% if i.size %} {{ i.size }}{% endif %}</option>
                            {% endfor %}
                        </select>
                    </td>
                    <td><input type="number" name="quantity" class="form-control" min="1" value="1" required></td>
                    <td><input type="number" step="0.01" name="unit_price" class="form-control price-input" value="0" required></td>
                    <td>
                        <select name="reason" class="form-control">
                            {% for r in reasons %}<option value="{{ r }}">{{ r }}</option>{% endfor %}
                        </select>
                    </td>
                    <td><button type="button" class="btn btn-secondary remove-line" style="width:auto;padding:8px;">×</button></td>
                </tr>
            </tbody>
        </table>
    </div>
    <button type="button" id="add-line" class="btn btn-secondary" style="width:auto;margin-top:12px;">Add Line</button>
    <div style="display:flex;gap:10px;margin-top:20px;">
        <button type="submit" class="btn btn-primary" style="width:auto;">Save Return</button>
        <a href="/returns" class="btn btn-secondary" style="width:auto;">Cancel</a>
    </div>
</form>
</div>
<script>
// Initialize searchable select on page load
document.querySelectorAll('.item-select').forEach(initSearchableSelect);

document.getElementById('add-line').addEventListener('click', function() {
    const body = document.getElementById('lines-body');
    const row = body.querySelector('.line-row').cloneNode(true);
    
    // Clean up cloned searchable select elements
    const wrapper = row.querySelector('.searchable-select-wrapper');
    if (wrapper) wrapper.remove();
    
    const select = row.querySelector('.item-select');
    if (select) {
        select.style.display = '';
        select.selectedIndex = 0;
    }
    
    row.querySelectorAll('input').forEach(i => { if (i.name==='quantity') i.value=1; else if (i.name==='unit_price') i.value=0; });
    row.querySelectorAll('select').forEach(s => { if (s !== select) s.selectedIndex = 0; });
    body.appendChild(row);
    
    if (select) {
        initSearchableSelect(select);
    }
});
document.getElementById('lines-body').addEventListener('click', function(e) {
    if (e.target.classList.contains('remove-line') && document.querySelectorAll('.line-row').length > 1) e.target.closest('tr').remove();
});
document.getElementById('lines-body').addEventListener('change', function(e) {
    if (e.target.name === 'item_id') {
        e.target.closest('tr').querySelector('.price-input').value = e.target.selectedOptions[0].getAttribute('data-price') || 0;
    }
});
</script>
{% endblock %}
