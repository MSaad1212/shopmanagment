{% extends "dashboard.html" %}
{% block title %}New Purchase{% endblock %}
{% block page_title %}New Purchase Entry{% endblock %}
{% block content %}
<div class="glass-panel" style="padding:24px;">
<form method="POST" action="/suppliers/purchases/new" id="purchase-form">
    <div class="form-grid">
        <div class="form-group">
            <label>Supplier *</label>
            <select name="supplier_id" class="form-control" required>
                <option value="">Select…</option>
                {% for s in suppliers %}
                <option value="{{ s.id }}">{{ s.supplier_code }} — {{ s.name }}</option>
                {% endfor %}
            </select>
        </div>
        <div class="form-group"><label>Date *</label><input type="date" name="date" class="form-control" value="{{ today }}" required></div>
        <div class="form-group"><label>Amount Paid Now</label><input type="number" step="0.01" name="amount_paid" class="form-control" value="0"></div>
        <div class="form-group">
            <label>Payment Method</label>
            <select name="payment_method" class="form-control">
                {% for m in payment_methods %}<option value="{{ m }}">{{ m }}</option>{% endfor %}
            </select>
        </div>
        <div class="form-group" style="grid-column:1/-1;"><label>Note</label><input name="note" class="form-control"></div>
    </div>

    <h4 style="margin:20px 0 12px;">Items</h4>
    <div class="table-container" style="margin-top:0;">
        <table class="data-table" id="lines-table">
            <thead><tr><th>Item</th><th>Qty</th><th>Unit Price</th><th></th></tr></thead>
            <tbody id="lines-body">
                <tr class="line-row">
                    <td>
                        <select name="item_id" class="form-control" required>
                            <option value="">Select item…</option>
                            {% for i in items %}
                            <option value="{{ i.id }}" data-price="{{ i.purchase_price }}">{{ i.item_code }} — {{ i.brand }}{% if i.pattern %} {{ i.pattern }}{% endif %}{% if i.size %} {{ i.size }}{% endif %}</option>
                            {% endfor %}
                        </select>
                    </td>
                    <td><input type="number" name="quantity" class="form-control" min="1" value="1" required></td>
                    <td><input type="number" step="0.01" name="unit_price" class="form-control price-input" value="0" required></td>
                    <td><button type="button" class="btn btn-secondary remove-line" style="width:auto;padding:8px;">×</button></td>
                </tr>
            </tbody>
        </table>
    </div>
    <button type="button" id="add-line" class="btn btn-secondary" style="width:auto;margin-top:12px;">Add Line</button>
    <div style="display:flex;gap:10px;margin-top:20px;">
        <button type="submit" class="btn btn-primary" style="width:auto;">Save Purchase</button>
        <a href="/suppliers/purchases" class="btn btn-secondary" style="width:auto;">Cancel</a>
    </div>
</form>
</div>
<script>
document.getElementById('add-line').addEventListener('click', function() {
    const body = document.getElementById('lines-body');
    const row = body.querySelector('.line-row').cloneNode(true);
    row.querySelectorAll('input').forEach(i => { if (i.name==='quantity') i.value=1; else if (i.name==='unit_price') i.value=0; });
    row.querySelector('select').selectedIndex = 0;
    body.appendChild(row);
});
document.getElementById('lines-body').addEventListener('click', function(e) {
    if (e.target.classList.contains('remove-line') && document.querySelectorAll('.line-row').length > 1) {
        e.target.closest('tr').remove();
    }
});
document.getElementById('lines-body').addEventListener('change', function(e) {
    if (e.target.name === 'item_id') {
        const opt = e.target.selectedOptions[0];
        const price = opt.getAttribute('data-price') || 0;
        e.target.closest('tr').querySelector('.price-input').value = price;
    }
});
</script>
{% endblock %}
