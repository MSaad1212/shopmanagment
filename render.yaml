services:
  - type: web
    name: metro-traders-shop
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn run:app -k uvicorn.workers.UvicornWorker --bind 0.0.0.0:$PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
